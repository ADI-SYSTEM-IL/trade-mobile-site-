<style>
  /* Single light look by choice (product catalog shown to customers) */
  :root { --bg: #ffffff; --fg: #171717; color-scheme: light; }
  body { background: var(--bg); color: var(--fg); font-family: 'Heebo', 'Segoe UI', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  /* Kia tile behaviour: photo zooms, overlay lightens on hover */
  .tile .media { transition: transform .5s ease-out; }
  .tile:hover .media { transform: scale(1.08); }
  .tile .shade { transition: opacity .5s ease-out; }
  .tile:hover .shade { opacity: .55; }
  @keyframes rise { from { transform: translateY(14px) } to { transform: none } }
  .rise { animation: rise .7s ease-out both; }
  #drawer { transition: transform .3s ease; }
  .site-header { top: env(safe-area-inset-top, 0px); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #fff; }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none } .tile .media { transition: none } }
  /* ───── Accessibility widget overrides (same as the Kia site) ───── */
  html { font-size: calc(1rem * var(--a11y-font-scale, 1)); }
  html.a11y-high-contrast { filter: contrast(1.4); background: #000; }
  html.a11y-high-contrast body, html.a11y-high-contrast .bg-white, html.a11y-high-contrast main,
  html.a11y-high-contrast section, html.a11y-high-contrast header, html.a11y-high-contrast footer { background: #000 !important; color: #fff !important; }
  html.a11y-high-contrast a, html.a11y-high-contrast .text-blue-600 { color: #ffeb3b !important; }
  html.a11y-highlight-links a { text-decoration: underline !important; text-decoration-thickness: 2px !important; text-underline-offset: 2px !important; outline: 1px dashed currentColor; outline-offset: 2px; }
  html.a11y-readable-font, html.a11y-readable-font body, html.a11y-readable-font * { font-family: Arial, Helvetica, sans-serif !important; letter-spacing: .02em; }
  html.a11y-reduced-motion *, html.a11y-reduced-motion *::before, html.a11y-reduced-motion *::after { animation-duration: .001s !important; animation-delay: 0s !important; transition-duration: .001s !important; }
  *:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
</style>

<!-- Header: hamburger + ADI × Trade Mobile -->

function spanClass(i, total) { // Kia asymmetric grid
  const full = Math.floor(total / 4), rem = total % 4, lastStart = full * 4;
  if (rem > 0 && i >= lastStart) {
    const p = i - lastStart;
    if (rem === 1) return 'col-span-2 lg:col-span-3';
    if (rem === 2) return p === 0 ? 'col-span-1 lg:col-span-2' : 'col-span-1';
    return 'col-span-1';
  }
  const rev = Math.floor(i / 4) % 2 === 1, pos = i % 4;
  if (pos === 0) return rev ? 'lg:row-span-2' : 'lg:col-span-2';
  if (pos === 1) return rev ? 'lg:col-span-2' : 'lg:row-span-2';
  return '';
}

    ['כללי', ['א.ד.י. מערכות סטריאו ואזעקות לרכב בע"מ (להלן: "א.ד.י") מכבדת את פרטיות המשתמשים באתריה ו/או בנכסיה הדיגיטליים ולהלן תתכבד לפרט את מדיניותה ביחס להגנת המידע ופרטיות (להלן: "המדיניות") שחלה ו/או תחול בקשר להגנה על כל מידע אישי, מכל סוג, שא.ד.י. אוספת, מעבדת, שומרת ומשתפת במהלך פעילותה העסקית, לרבות (אך לא רק) באמצעות אתרי אינטרנט, יישומים, ממשקים אלקטרוניים לסוגיהם וכל נכס דיגיטלי שהוא (להלן לשם הנוחות: "הנכסים"). בהמשך כתב זה תפורטנה גם זכויות מסוימות העומדות למשתמשים לפי חוק הגנת הפרטיות, התשמ"א-1981.', 'המדיניות עשויה להתעדכן מעת לעת, והעדכונים והשינויים ייכנסו לתוקף, יפורסמו ויעודכנו במסגרת הנכסים. המשך השימוש של המשתמש בשירותים לאחר עדכון מדיניות הפרטיות ייחשב הסכמה מצדו למדיניות הפרטיות המעודכנת, לרבות לשינויים.', 'בכל דבר ו/או עניין, שאלה, הערה וכיו"ב בקשר למדיניות ניתן ליצור קשר עם א.ד.י. מערכות סטריאו ואזעקות לרכב בע"מ, אליהו איתן 1 ראשון לציון.']],
    ['עקרונות', ['בעת שימוש בנכסים נאסף מידע על המשתמש. חלק מהמידע נמסר ביודעין ו/או מזהה את המשתמש אישית בשמו ובכתובתו, במספר הטלפון שלו (קווי או נייד), בכתובת הדוא"ל שלו, במספר תעודת הזהות שלו או במספר התאגיד שלו, בשימושו בנכסים ובטיב ואופן השימוש, אמצעי תשלום בהם נעשה שימוש, מידע נוסף שהמשתמש יבחר למסור בטפסים או בהרשמות בנכסים וכיו"ב. חלק מהמידע הינו סטטיסטי ומצטבר ואינו מזהה את המשתמש אישית ואינו נשמר ביחד עם פרטי המשתמש, כגון תכנים שנקראו, העמודים שנצפו, כתובת האינטרנט (IP) שממנה נעשו פניות ועוד.', 'א.ד.י. מחויבת לכך שהמידע האישי של המשתמש ופרטיותו יהיו מוגנים בהתאם לחובות שחלות עליה לפי הדין. מדיניות זו מסבירה את זכויות המשתמש לגבי המידע האישי שא.ד.י אוספת, מעבדת ושומרת במהלך פעילותה העסקית באמצעות הנכסים ולגבי שימוש שלה באמצעי הגנה בכדי להגן על מידע זה.', 'א.ד.י. פועלת כדי שהמידע האישי של המשתמש ייאסף, יישמר ויאוחסן אצלה בהתאם לכל דין, בהגינות, שקיפות, תום לב ומידתיות, תוך נקיטה בפעולות המתאימות ותוך שאיפה להקטנת הסיכונים העשויים להתרחש כתוצאה מתהליכי עיבוד המידע.', 'איסוף, עיבוד ושימוש במידע האישי של המשתמש עשוי להתבצע על ידי צדדים שלישיים שפועלים מטעמה של א.ד.י. במהלך העסקים השוטף שלה ו/או תוך כדי מתן השירותים על ידה.']],
    ['הטעמים לשימוש במידע האישי', ['א.ד.י. משתמשת במידע האישי של המשתמש כדי לספק למשתמש את השירותים שהוא מבקש, כדי לעבד את הבקשות שלו ואת השימוש שלו במסגרת הנכסים, כדי לשפר את חוויית המשתמש שלו ולפתח שירותים נוספים, וכן כדי להציע למשתמש שירותים נוספים, לשלוח לו עדכונים, הודעות, דברי פרסומת וכיו"ב, כפוף להסכמתו. כמו כן א.ד.י. אוספת את המידע האישי של המשתמש לשם תחזוקה של השירותים, ניטור פעילות המשתמש בנכסים, שיפור איכות השירותים, יצירת קשר עם המשתמש, עריכת נתונים סטטיסטיים, ניתוח, מחקר והעברת מידע (לרבות סטטיסטי) לצדדים שלישיים, עריכת סקרים, התאמת מודעות שיוצגו למשתמשים ועשויים להתאים להעדפותיהם, ניתוח פרופילים של המשתמשים לשם שיווק מוצרים, לצרכי דיוור ישיר, לצרכים פנימיים של א.ד.י., לשם התגוננות מפני תביעות, דרישות וטענות נגד א.ד.י. ומי מטעמה וכן נגד צדדים שלישיים, לשם אכיפה של הוראות המדיניות, ולשם עמידה בהוראות כל דין.', 'המידע האישי של המשתמש משמש גם עבור קבצי "עוגיות" (Cookies) (וטכנולוגיות דומות) ומעקב נכסים, אתרים ובאפליקציות המאפשרים להבדיל אותו ממשתמשים אחרים, ולשפר את השימוש שלו בממשקים אלה.', 'השימוש ב"עוגיות" (Cookies) וטכנולוגיות דומות נעשה לצורך התפעול השוטף והתקין, ובכלל זה כדי לאסוף ולשמר נתונים סטטיסטיים אודות השימוש בנכסים, לשם אימות פרטי המשתמש, כדי להתאים אותם להעדפות/הגדרות המשתמש ולשלוח עדכונים, הודעות ודברי פרסומת מתאימים, לניתוח סטטיסטי של ביצועי נכסים, ניתוח המגמה, ניטור שגיאות זיהוי ולצורכי אבטחת מידע. "עוגיות" (Cookies) וטכנולוגיות דומות אינם יכולים להתקין תוכנות זדוניות כגון וירוסים במכשיר של המשתמש.', 'מובהר כי באפשרות המשתמש לשלוט ב"עוגיות" (Cookies) וטכנולוגיות דומות ברמת הדפדפן הפרטי וכן להימנע מקבלתם או למחוק את הקבצים הנ"ל. אם המשתמש לא יודע כיצד לעשות זאת, עליו לבדוק זאת באמצעות הדפדפן בו הוא עושה שימוש. השימוש של המשתמש בשירותים ייחשב הסכמה מצדו לשימוש ב"עוגיות" (Cookies) וטכנולוגיות דומות כאמור לעיל עד כמה שהשימוש מתאפשר בשים לב לפעולות שהמשתמש נקט (או לא נקט) ברמת הדפדפן הפרטי שלו, כאמור לעיל.']],
    ['סוגי המידע האישי שנאסף ומטרות האיסוף והעיבוד', ['המידע האישי של המשתמש שנאסף ו/או מעובד ו/או שבו נעשה שימוש, מוגבל למידע הנחוץ לא.ד.י. כדי לספק למשתמש שירותים במהלך עסקיה, תוך הגנה על המידע וקיום חובות המוטלות על א.ד.י. על-פי דין בקשר לכך. הגישה למידע, הכוללת גם גישה פיזית, מוגבלת לעובדים ולצדדים שלישיים המתקשרים עם א.ד.י., והם משתמשים בו למטרות המפורטות להלן בלבד.', 'המידע שנאסף ומעובד כולל גם מידע כללי המשמש למטרות טכניות ובהתאם לשירותים שא.ד.י. תבחר ותשתמש בהם.', 'עשוי להיות עיבוד ואחסון אוטומטי של מידע אישי של המשתמש. מידע זה כולל גם כתובות IP, סוג הדפדפן, ספק שירותי האינטרנט, דפי הפניה ויציאה, מערכות הפעלה, חותמת תאריך / שעה ונתונים של הקלקות, וא.ד.י עשויה להשתמש בו כדי לנתח מגמות, לנהל את הנכסים, לעקוב אחר תנועות משתמשים דרכם, לאסוף מידע על בסיס המשתמשים בכללותו, ולקשר מידע שנאסף באופן אוטומטי למידע אישי למטרות עסקיות לגיטימיות, כגון איתור ומניעת פעילות הונאה, וכן למטרות אחרות.', 'כאשר שירותים של א.ד.י. מתקבלים אצל המשתמש דרך ו/או באמצעות הנכסים, אפשר ותהיה הפנייה ל"ספקים-צד שלישי" (לדוגמה, ספקי שירות תשלומים, כולל כרטיס אשראי או ספקי תשלום מקוונים ו/או שירותי מיקום, ספק שירותי תמיכה במערכות האבטחה ומערכות טכנולוגיית מידע (IT), ספק שירותי אחסון מידע, ספק שירותי סליקה, ספק שירותי בניית אתרים, ספק שירותי עריכת סקרים ומחקרים, חברות שליחויות, ספק לוגיסטיקה, ספק שירותי פרסום ושיווק, עורכי דין או יועצים מקצועיים חיצוניים אחרים וכן צדדים שלישיים נוספים אשר מעניקים ל-א.ד.י. שירותים בקשר עם פעילותה, וכיו"ב). כאשר א.ד.י משתמשת ב"ספקים-צד שלישי" היא מסתמכת על ספק השירות שמעבד את המידע האישי.', 'א.ד.י. תהיה רשאית להעביר לצד שלישי את המידע האישי של המשתמש במקרה של מיזוג, שינוי שליטה, רכישה או העברת הפעילות של א.ד.י לצד שלישי. העברת המידע האישי בנסיבות אלה תהיה כפופה לכך שמקבל המידע יפעל בהתאם למדיניות כהגדרתה לעיל.', 'יתכנו מצבים בהם א.ד.י. תידרש להעביר את המידע האישי של המשתמש למטרות שתוארו לעיל לצדדים שלישיים, וא.ד.י תהא רשאית לעשות כן בנסיבות הבאות: אם העברת המידע נחוצה לשם פעילות המשתמש בנכסים; אם א.ד.י. נדרשת לעשות זאת על פי כל דין ו/או החוק החל, צו בית המשפט או רגולציה אחרת; או אם העברת המידע אושרה בדרך אחרת ו/או נדרשת בכל חקירה פלילית או משפטית או בכל הליך משפטי או במקרה שהמשתמש פעל בנכסים בניגוד לדין. בנוסף א.ד.י. תהיה רשאית להעביר לצד שלישי את המידע האישי של המשתמש בכל מחלוקת, טענה, דרישה, תביעה או הליכים משפטיים כלשהם בין המשתמש או מי מטעמו לבין א.ד.י. ומי מטעמה.', 'אם תועלה טענה או יתעורר אצל א.ד.י. חשד שהמשתמש ביצע מעשה או מחדל שעשויים לפגוע בה, במי מטעמה, ובצדדים שלישיים כלשהם, לרבות משתמשים אחרים, וכן אם תועלה טענה או יתעורר אצל א.ד.י. חשד שמשתמש עושה שימוש בנכסים לצורך ביצוע מעשה בלתי חוקי או כדי לאפשר, להקל, לסייע, לעודד את ביצועו של מעשה כזה — א.ד.י. תהיה רשאית להעביר את המידע האישי של המשתמש לצד שלישי. כמו כן היא תהיה רשאית לעשות זאת במקרה שתסבור כי מסירת המידע האישי נדרשת כדי למנוע נזק לה, למשתמש או לצד שלישי כלשהו.', 'א.ד.י. וכל מי מטעמה לא יישאו בכל חבות, והם פטורים מכל אחריות, בקשר עם כל נזק, הפסד והוצאה, מכל מין וסוג שהם, בין אם ישירים ובין אם עקיפים, נסיבתיים ותוצאתיים, אשר ייגרמו למשתמש ולצד שלישי בכל הקשור והנוגע ל"ספק-צד שלישי" ולצד שלישי אחר, לרבות בכל הקשור לאיסוף המידע על ידי "ספק-צד שלישי" וצד שלישי אחר, השימוש בו, העברתו לצדדים נוספים, שמירתו, אבטחתו ועוד.']],
    ['ההגנה על המידע האישי של המשתמש ופרטיותו', ['א.ד.י נוקטת בכל האמצעים הטכניים והארגוניים המקובלים כדי למזער סיכונים ו/או להגן על המידע האישי של המשתמש מפני אובדן, חשיפה, שינוי, פגיעה, גניבה או גישה של צדדים שלישיים בלתי מורשים.', 'א.ד.י. לא תמכור, תשתף, תעביר או תשתמש בנתונים שהיא אוספת למטרות אחרות מאלה המפורטות במפורש במדיניות זאת.', 'א.ד.י. תמחק את המידע האישי של המשתמש כאשר המטרה העסקית שעבורה נאסף או מעובד המידע הסתיימה, או אם כללי הגנת המידע (על-פי הדין) יחייבו אותה למחוק מידע אישי זה.', 'יחד עם זאת, אין וודאות שכל האמצעים בהם א.ד.י. נוקטת להגנה על המידע האישי ימנעו גישה ו/או חדירה בלתי-מורשית לנכסים ו/או למידע האישי מצד צדדים שלישיים לא מורשים. מדובר במזעור סיכונים בלבד, וא.ד.י לא מתחייבת שהמידע האישי ו/או שירותיה ו/או הנכסים יהיו חסינים באופן מוחלט בפני גישה בלתי-מורשית. המשתמש מוסר את המידע האישי בהסכמה מלאה ובמודעות לסכנות הכרוכות בהעברת המידע באמצעות הנכסים.', 'א.ד.י. וכל מי מטעמה לא ישאו בכל חבות ויהיו פטורים מכל אחריות בקשר לכל נזק, הפסד, הוצאה ואובדן, עקיפים וישירים, נסיבתיים ותוצאתיים, שייגרמו למשתמש ולצד שלישי בכל הקשור והנוגע לאיסוף המידע, השימוש בו, העברתו לצדדים שלישיים, שמירתו ואבטחתו, כולל אלה הנובעים מחדירה ו/או גישה בלתי מורשית למידע האישי ו/או משימוש לא נאות ו/או מכל מחדל ו/או הפרה של פעולות אבטחה המביא/ה להרס, אובדן, שינוי, גילוי או גישה בלתי מורשית של המידע אישי של המשתמש.', 'אם המשתמש יספק מידע אישי לא.ד.י. בקשר לאנשים אחרים, לרבות בני משפחתו, הוא יעשה זאת רק לאחר שהמשתמש עדכן אותם בדבר המדיניות, וקיבל את הסכמתם למדיניות.']],
    ['זכויות המשתמש', ['מסירת המידע האישי של המשתמש לא.ד.י. תלויה ברצונו ובהסכמתו של המשתמש, ולא חלה עליו חובה חוקית למסור אותו לא.ד.י. השימוש בשירותים שמציעה א.ד.י. מעידים על הסכמתו של המשתמש למדיניות ולכך שהמידע יישמר וינוהל בהתאם למדיניות. אלא אם היא מורשית או מחויבת חוקית לבצע איסוף/עיבוד כאמור גם מבלי שניתנה הסכמה מצד המשתמש.', 'אם המשתמש לא מסכים למסור את המידע לא.ד.י., ייתכן שהיא לא תוכל לספק לו את כל השירותים שהיא מציעה או את חלקם.', 'המשתמש רשאי לבטל או למשוך את הסכמתו הנ"ל בכל עת וכן לבקש לעיין במידע האישי שא.ד.י אספה/עיבדה ולבקש לתקנו או למחוק אותו (כולו או חלקו) – הכול באמצעות שליחת בקשה לא.ד.י. א.ד.י. תפעל בהתאם לבקשת המשתמש בתוך 30 יום, אלא אם כן היא מחויבת ו/או מורשית על פי כל דין לשמור על המידע ו/או באם יש לה אינטרס לגיטימי כלשהו (על-פי דין) שלא לעשות כן ובכפוף לשיקולים טכניים.']],

}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const adminCard = (title, body, cls = '') => `<div class="rounded-2xl border border-neutral-200 bg-white p-4 sm:p-5 ${cls}"><h2 class="mb-3 text-base font-bold text-neutral-900">${title}</h2>${body}</div>`;
const adminWrap = body => `<div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">${body}</div>`;

function renderAdmin() {
  document.title = 'אנליטיקה | אדי × טרייד מוביל';
  if (!SUPABASE_URL) return adminWrap('<p class="text-neutral-500">האנליטיקה עוד לא מחוברת.</p>');
  setTimeout(initAdmin, 0);
  return adminWrap('<div id="adminBody" class="text-neutral-500">טוען…</div>');
}
async function initAdmin() {
  const box = document.getElementById('adminBody');
  try { await loadSupabase(); } catch { box.textContent = 'לא ניתן לטעון את מערכת הכניסה. נסו לרענן.'; return; }
  const { data } = await sb.auth.getSession();
  if (data.session) renderAdminDashboard(); else renderAdminLogin();
}
function renderAdminLogin(error = '') {
  const box = document.getElementById('adminBody');
  if (!box) return;
  box.innerHTML = `
    <form id="adminLogin" class="mx-auto mt-6 max-w-sm space-y-4 rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
      <h1 class="text-2xl font-bold text-neutral-900">כניסה לאנליטיקה</h1>
      <label class="block text-sm font-medium text-neutral-700">דוא״ל
        <input name="email" type="email" required autocomplete="username" dir="ltr" class="mt-1 block w-full rounded-lg border border-neutral-300 px-3 py-2.5 text-base focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"></label>
      <label class="block text-sm font-medium text-neutral-700">סיסמה
        <input name="password" type="password" required autocomplete="current-password" dir="ltr" class="mt-1 block w-full rounded-lg border border-neutral-300 px-3 py-2.5 text-base focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"></label>
      ${error ? `<p class="text-sm text-red-600">${esc(error)}</p>` : ''}
      <button class="w-full rounded-lg bg-blue-600 py-2.5 font-semibold text-white hover:bg-blue-700">כניסה</button>
    </form>`;
  document.getElementById('adminLogin').addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    e.target.querySelector('button').textContent = 'מתחבר…';
    const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
    if (error) renderAdminLogin('דוא״ל או סיסמה שגויים'); else renderAdminDashboard();
  });
}
async function fetchEvents(days) {
  const since = new Date(Date.now() - days * 864e5).toISOString();
  const rows = [];
  for (let from = 0; ; from += 1000) {   // Supabase returns up to 1000 rows per request
    const { data, error } = await sb.from('tm_analytics_events')
      .select('created_at,event_type,page,product,session_id,device_type,metadata')
      .gte('created_at', since).order('created_at', { ascending: true }).range(from, from + 999);
    if (error) throw error;
    rows.push(...data);
    if (data.length < 1000 || rows.length >= 100000) break;
  }
  return rows;
}
const PAGE_NAMES = { '/': 'דף הבית', '/reps': 'מידע לנציגים', '/accessibility': 'הצהרת נגישות', '/terms': 'תקנון', '/privacy': 'מדיניות פרטיות' };
const barRow = (label, n, max, color = 'bg-blue-500', extra = '', labelW = 'w-40 sm:w-56') => `
  <div class="flex items-center gap-3 text-sm">
    <span class="${labelW} shrink-0 truncate text-neutral-700">${label}</span>
    <div class="h-2.5 flex-1 overflow-hidden rounded-full bg-neutral-100"><div class="h-full rounded-full ${color}" style="width:${max && n ? Math.max(2, n / max * 100) : 0}%"></div></div>
    <span class="min-w-[2.5rem] shrink-0 whitespace-nowrap text-left font-semibold tabular-nums text-neutral-900">${n.toLocaleString('he-IL')}${extra}</span>
  </div>`;

async function renderAdminDashboard() {
  const box = document.getElementById('adminBody');
  if (!box) return;
  box.innerHTML = '<p class="text-neutral-500">טוען נתונים…</p>';
  let rows;
  try { rows = await fetchEvents(adminDays); }
  catch { box.innerHTML = '<p class="text-red-600">לא ניתן לטעון נתונים. ייתכן שהמשתמש הזה לא מורשה לצפות באנליטיקה.</p>'; return; }

  const sessions = new Set(rows.map(r => r.session_id));
  const views = rows.filter(r => r.event_type === 'page_view' || r.event_type === 'product_view');
  const productViews = rows.filter(r => r.event_type === 'product_view');
  const sheetViews = rows.filter(r => r.event_type === 'sheet_view');

  // Visitors per day
  const dayKey = d => d.toLocaleDateString('en-CA');
  const days = [];
  for (let i = adminDays - 1; i >= 0; i--) days.push(dayKey(new Date(Date.now() - i * 864e5)));
  const perDay = Object.fromEntries(days.map(d => [d, new Set()]));
  rows.forEach(r => { const k = dayKey(new Date(r.created_at)); if (perDay[k]) perDay[k].add(r.session_id); });
  const dayCounts = days.map(d => perDay[d].size), dayMax = Math.max(1, ...dayCounts);
  const chart = `
    <div class="flex h-40 items-end gap-[2px]" dir="ltr">
      ${days.map((d, i) => `<div class="group relative flex-1 rounded-t bg-blue-500/80 hover:bg-blue-600" style="height:${Math.max(dayCounts[i] ? 4 : 1, dayCounts[i] / dayMax * 100)}%" title="${d.split('-').reverse().join('.')}: ${dayCounts[i]} מבקרים"></div>`).join('')}
    </div>
    <div class="mt-1 flex justify-between text-xs text-neutral-400" dir="ltr"><span>${days[0].split('-').reverse().slice(0, 2).join('.')}</span><span>${days.at(-1).split('-').reverse().slice(0, 2).join('.')}</span></div>`;

  // Products
  const prodStats = items.map(it => {
    const pv = productViews.filter(r => r.product === it.slug);
    const dw = rows.filter(r => r.event_type === 'dwell_time' && r.product === it.slug).map(r => +(r.metadata || {}).duration_seconds || 0);
    return { slug: it.slug, parts: it.parts, title: it.title, opens: pv.length, people: new Set(pv.map(r => r.session_id)).size, sheets: sheetViews.filter(r => r.product === it.slug).length,
      dwell: dw.length ? Math.round(dw.reduce((a, b) => a + b, 0) / dw.length) : null };
  }).sort((a, b) => b.opens - a.opens);
  const fmtDur = s => s == null ? '—' : s < 60 ? `${s} שנ׳` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} דק׳`;

  // Scroll depth (like Kia): how many got to 25/50/75/100% of a page
  const scrollRows = rows.filter(r => r.event_type === 'scroll_depth');
  const depthCount = d => scrollRows.filter(r => +(r.metadata || {}).depth === d).length;
  const depth25 = depthCount(25) || 1;
  const scrollCard = [25, 50, 75, 100].map(d => barRow(`${d}%`, depthCount(d), depth25, 'bg-blue-500', '', 'w-12')).join('') +
    '<p class="pt-1 text-xs text-neutral-400">כמה מגלגלים עד הסוף? (דף הבית וחלונות המוצרים)</p>';
  const prodMax = Math.max(0, ...prodStats.map(p => p.opens));
  const prodTable = `
    <div class="overflow-x-auto"><table class="w-full text-sm">
      <thead><tr class="border-b border-neutral-200 text-right text-neutral-500"><th class="py-2 font-medium">מוצר</th><th class="py-2 font-medium">פתיחות</th><th class="py-2 font-medium">מבקרים</th><th class="py-2 font-medium">דף מוצר</th><th class="py-2 font-medium">זמן צפייה ממוצע</th><th class="hidden w-1/4 py-2 sm:table-cell"></th></tr></thead>
      <tbody>${prodStats.map(p => `<tr class="border-b border-neutral-100">
        <td class="py-2.5 font-medium text-neutral-900">${esc(p.title)}</td><td class="tabular-nums">${p.opens}</td><td class="tabular-nums">${p.people}</td><td class="tabular-nums">${p.sheets}</td><td class="whitespace-nowrap tabular-nums">${fmtDur(p.dwell)}</td>
        <td class="hidden py-2.5 sm:table-cell"><div class="h-2 overflow-hidden rounded-full bg-neutral-100"><div class="h-full rounded-full bg-emerald-500" style="width:${prodMax ? p.opens / prodMax * 100 : 0}%"></div></div></td></tr>
        ${(p.parts || []).map(part => {
          // Kit items: each part has its own product sheet, counted separately
          const file = part.sheet.split('/').pop();
          const n = sheetViews.filter(r => (r.metadata || {}).sheet === file).length;
          return `<tr class="border-b border-neutral-100 bg-neutral-50/60 text-neutral-600">
            <td class="py-2 pr-5 text-[13px]">↳ ${esc(part.name)}</td><td class="text-neutral-300">—</td><td class="text-neutral-300">—</td><td class="tabular-nums">${n}</td><td class="text-neutral-300">—</td><td class="hidden sm:table-cell"></td></tr>`;
        }).join('')}`).join('')}</tbody>
    </table></div>`;

  // Devices (by visitor)
  const devBySession = {};
  rows.forEach(r => { devBySession[r.session_id] = r.device_type; });
  const devCount = { mobile: 0, tablet: 0, desktop: 0 };
  Object.values(devBySession).forEach(d => { if (d in devCount) devCount[d]++; });
  const devTotal = Object.values(devCount).reduce((a, b) => a + b, 0);
  const devices = [['נייד', 'mobile', 'bg-blue-500'], ['טאבלט', 'tablet', 'bg-green-500'], ['מחשב', 'desktop', 'bg-purple-500']]
    .map(([l, k, c]) => barRow(l, devCount[k], devTotal, c, devTotal ? ` <span class="font-normal text-neutral-400">(${Math.round(devCount[k] / devTotal * 100)}%)</span>` : '', 'w-14')).join('');

  // Peak hours
  const hours = Array(24).fill(0);
  views.forEach(r => hours[new Date(r.created_at).getHours()]++);
  const hMax = Math.max(1, ...hours);
  const peak = `
    <div class="flex h-28 items-end gap-[2px]" dir="ltr">${hours.map((n, h) => `<div class="flex-1 rounded-t bg-amber-400" style="height:${Math.max(n ? 4 : 1, n / hMax * 100)}%" title="${String(h).padStart(2, '0')}:00 — ${n} צפיות"></div>`).join('')}</div>
    <div class="mt-1 flex justify-between text-xs text-neutral-400" dir="ltr"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>`;

  // Pages
  const pageCount = {};
  rows.filter(r => r.event_type === 'page_view').forEach(r => { pageCount[r.page] = (pageCount[r.page] || 0) + 1; });
  const pageList = Object.entries(pageCount).sort((a, b) => b[1] - a[1]);
  const pMax = pageList.length ? pageList[0][1] : 0;
  const pages = pageList.length ? pageList.map(([p, n]) => barRow(esc(PAGE_NAMES[p] || p), n, pMax, 'bg-neutral-700')).join('') : '<p class="text-sm text-neutral-400">אין עדיין נתונים</p>';

  const kpi = (label, n) => `<div class="rounded-2xl border border-neutral-200 bg-white p-4"><div class="text-sm text-neutral-500">${label}</div><div class="mt-1 text-3xl font-black tabular-nums text-neutral-900">${n.toLocaleString('he-IL')}</div></div>`;
  const { data: { session } } = await sb.auth.getSession();
  box.innerHTML = `
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
      <div><h1 class="text-2xl font-bold text-neutral-900">אנליטיקה</h1><p class="text-sm text-neutral-500">רק מבקרים שאישרו עוגיות סטטיסטיקה נספרים</p></div>
      <div class="flex flex-wrap items-center gap-2">
        ${[7, 14, 30, 90].map(d => `<button data-days="${d}" class="rounded-full px-3.5 py-1.5 text-sm font-medium ${d === adminDays ? 'bg-neutral-900 text-white' : 'bg-neutral-100 text-neutral-700 hover:bg-neutral-200'}">${d} ימים</button>`).join('')}
        <button id="adminPassword" class="rounded-full border border-neutral-300 px-3.5 py-1.5 text-sm text-neutral-600 hover:bg-neutral-50">שינוי סיסמה</button>
        <button id="adminLogout" class="rounded-full border border-neutral-300 px-3.5 py-1.5 text-sm text-neutral-600 hover:bg-neutral-50" title="${esc(session?.user?.email)}">יציאה</button>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
      ${kpi('מבקרים', sessions.size)}${kpi('צפיות', views.length)}${kpi('פתיחות מוצר', productViews.length)}${kpi('צפיות בדף מוצר', sheetViews.length)}
    </div>
    <div class="mt-4 grid gap-4">
      ${adminCard('מבקרים לפי יום', chart)}
      ${adminCard('המוצרים', prodTable)}
      <div class="grid gap-4 lg:grid-cols-3">
        ${adminCard('התפלגות מכשירים', `<div class="space-y-3">${devices}</div>`)}
        ${adminCard('עומק גלילה', `<div class="space-y-3">${scrollCard}</div>`)}
        ${adminCard('שעות שיא', peak)}
      </div>
      ${adminCard('עמודים', `<div class="space-y-3">${pages}</div>`)}
    </div>`;
  box.querySelectorAll('[data-days]').forEach(b => b.addEventListener('click', () => { adminDays = +b.dataset.days; renderAdminDashboard(); }));
  document.getElementById('adminLogout').addEventListener('click', async () => { await sb.auth.signOut(); renderAdminLogin(); });
  document.getElementById('adminPassword').addEventListener('click', openPasswordDialog);
}

// Change the signed-in user's own password
function openPasswordDialog() {
  const wrap = document.createElement('div');
  wrap.className = 'fixed inset-0 z-[70] flex items-center justify-center bg-black/50 p-4';
  wrap.innerHTML = `
    <form class="w-full max-w-sm space-y-4 rounded-2xl bg-white p-6 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
      <div class="flex items-center justify-between"><h2 id="pwTitle" class="text-xl font-bold text-neutral-900">שינוי סיסמה</h2>
        <button type="button" data-pw="close" aria-label="סגירה" class="rounded-full p-1 text-xl leading-none text-neutral-400 hover:bg-neutral-100">✕</button></div>
      <label class="block text-sm font-medium text-neutral-700">סיסמה חדשה
        <input name="p1" type="password" required minlength="6" autocomplete="new-password" dir="ltr" class="mt-1 block w-full rounded-lg border border-neutral-300 px-3 py-2.5 text-base focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"></label>
      <label class="block text-sm font-medium text-neutral-700">שוב את הסיסמה החדשה
        <input name="p2" type="password" required minlength="6" autocomplete="new-password" dir="ltr" class="mt-1 block w-full rounded-lg border border-neutral-300 px-3 py-2.5 text-base focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"></label>
      <p class="text-xs text-neutral-500">לפחות 6 תווים.</p>
      <p data-pw="msg" class="hidden text-sm"></p>
      <button class="w-full rounded-lg bg-blue-600 py-2.5 font-semibold text-white hover:bg-blue-700">שמירה</button>
    </form>`;
  document.body.appendChild(wrap);
  const form = wrap.querySelector('form'), msg = wrap.querySelector('[data-pw="msg"]');
  const say = (t, ok) => { msg.textContent = t; msg.className = 'text-sm ' + (ok ? 'text-emerald-600' : 'text-red-600'); };
  wrap.addEventListener('click', e => { if (e.target === wrap || e.target.closest('[data-pw="close"]')) wrap.remove(); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = form.p1.value, p2 = form.p2.value;
    if (p1 !== p2) return say('הסיסמאות לא זהות', false);
    form.querySelector('button:last-child').disabled = true;
    const { error } = await sb.auth.updateUser({ password: p1 });
    form.querySelector('button:last-child').disabled = false;
    if (error) return say(/different|same/i.test(error.message) ? 'הסיסמה החדשה זהה לישנה' : /weak|short|least/i.test(error.message) ? 'הסיסמה חלשה מדי' : 'השינוי לא הצליח. נסו שוב.', false);
    form.p1.value = form.p2.value = '';
    say('הסיסמה עודכנה ✓', true);
    setTimeout(() => wrap.remove(), 1500);
  });
  form.p1.focus();
}

function route() {
  const h = location.hash.slice(1);
  trackPage();
  closeMenu();
  const app = document.getElementById('app');
  const onHome = !!app.querySelector('#products');
  if (h.startsWith('p-') && items.some(x => x.slug === h.slice(2))) {
    if (!onHome) { app.innerHTML = renderHome(); window.scrollTo(0, 0); }
    openItem(h.slice(2));
    return;
  }
  closeItem();
  if (h === 'reps') { app.innerHTML = renderReps(); window.scrollTo(0, 0); return; }
  if (LEGAL[h]) { app.innerHTML = LEGAL[h](); window.scrollTo(0, 0); return; }
  if (h === 'admin') { app.innerHTML = renderAdmin(); window.scrollTo(0, 0); return; }
  if (!onHome) { app.innerHTML = renderHome(); window.scrollTo(0, 0); }
}
window.addEventListener('hashchange', route);
route();
</script>
