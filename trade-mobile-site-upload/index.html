<title>אדי × טרייד מוביל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>document.documentElement.dir = 'rtl'; document.documentElement.lang = 'he';</script>
<style>
  /* Single light look by choice (product catalog shown to customers) */
  :root { --bg: #ffffff; --fg: #171717; color-scheme: light; }
  body { background: var(--bg); color: var(--fg); font-family: 'Heebo', 'Segoe UI', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  /* Kia tile behaviour: photo zooms, overlay lightens on hover */
  .tile .media { transition: transform .5s ease-out; }
  .tile:hover .media { transform: scale(1.08); }
  .tile .shade { transition: opacity .5s ease-out; }
  .tile:hover .shade { opacity: .55; }
  @keyframes rise { from { transform: translateY(14px) } to { transform: none } }
  .rise { animation: rise .7s ease-out both; }
  #drawer { transition: transform .3s ease; }
  .site-header { top: env(safe-area-inset-top, 0px); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #fff; }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none } .tile .media { transition: none } }
  *:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
</style>

<!-- Header: hamburger + ADI × Trade Mobile -->
<header class="site-header sticky z-30 w-full border-b border-neutral-100 bg-white/95 backdrop-blur">
  <div class="relative flex items-center justify-center px-4 py-3 sm:py-4">
    <button id="menuBtn" class="absolute right-3 flex h-11 w-11 items-center justify-center rounded-xl hover:bg-neutral-100 sm:right-6" aria-label="תפריט">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-6 w-6"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a href="#home" class="flex items-center gap-4 sm:gap-8">
      <img src="images/adi-logo.png" alt="אדי מערכות לרכב" class="h-9 w-auto sm:h-12">
      <span class="text-xl font-light text-neutral-300 sm:text-2xl">×</span>
      <img src="images/Trade%20Mobile%20Hebrew%20logo%20cutout%20(1).png" alt="טרייד מוביל" class="h-10 w-auto sm:h-14">

    </a>
  </div>
</header>

<!-- Hamburger drawer -->
<div id="scrim" class="fixed inset-0 z-40 hidden bg-black/40"></div>
<nav id="drawer" class="fixed inset-y-0 right-0 z-50 flex w-80 max-w-[85vw] translate-x-full flex-col bg-white shadow-2xl" aria-label="תפריט" style="padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)">
  <div class="flex items-center justify-between border-b border-neutral-100 px-5 py-4">

    <button id="menuClose" class="flex h-10 w-10 items-center justify-center rounded-full bg-neutral-100 text-lg hover:bg-neutral-200" aria-label="סגירה">✕</button>
  </div>

<div id="app"></div>

function spanClass(i, total) { // Kia asymmetric grid
  const full = Math.floor(total / 4), rem = total % 4, lastStart = full * 4;
  if (rem > 0 && i >= lastStart) {
    const p = i - lastStart;
    if (rem === 1) return 'col-span-2 lg:col-span-3';
    if (rem === 2) return p === 0 ? 'col-span-1 lg:col-span-2' : 'col-span-1';
    return 'col-span-1';
  }
  const rev = Math.floor(i / 4) % 2 === 1, pos = i % 4;
  if (pos === 0) return rev ? 'lg:row-span-2' : 'lg:col-span-2';
  if (pos === 1) return rev ? 'lg:col-span-2' : 'lg:row-span-2';
  return '';
}

// Tile picture: one photo, or for the kit a collage of its 5 products
function tileMedia(it) {
  const p = photos[it.slug];
  if (!p.tile) return `
    <div class="media absolute inset-0">
      <img src="${I(KIT_TRUNK)}" alt="" class="absolute inset-0 h-full w-full object-cover">
      <div class="absolute inset-x-[14%] top-[30%] flex items-end justify-center gap-[2%]">
        ${partPhotos.map(src => `<div class="aspect-square w-[18%] overflow-hidden rounded-md bg-white shadow-lg ring-1 ring-black/5 sm:rounded-lg"><img src="${I(src)}" alt="" class="h-full w-full object-contain p-[8%]"></div>`).join('')}
      </div>
    </div>`;
  return `<img src="${I(p.tile)}" alt="" class="media absolute inset-0 h-full w-full ${p.light ? 'bg-white object-contain p-4 sm:p-8' : 'object-cover'}">`;
}

      </div>
      <div class="grid gap-1 p-4 sm:grid-cols-[12rem_1fr] sm:gap-6 sm:p-5">
        <dt class="font-bold text-neutral-900">איתור אקילס</dt>
        <dd class="text-neutral-600">מערכת איתור פעילה עם לוח מקשים בלבד, אינה כוללת דמי מנוי, ויש לבדוק מול הלקוח לפני דרישת מיגון.</dd>
      </div>
      <div class="grid gap-1 p-4 sm:grid-cols-[12rem_1fr] sm:gap-6 sm:p-5">
        <dt class="font-bold text-neutral-900">עמלות</dt>
        <dd class="text-neutral-600">במכירת חבילות האבזור הקבועות משולמת עמלה לנציג ולמנהל כמפורט בטבלה.</dd>
      </div>
    </dl>
  </div>`;
}

// SKU with a one-tap copy button (shown only when filled in)
const copyIco = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const skuChip = key => {
  const sku = (SKUS[key] || '').trim();
  if (!sku) return '';
  return `<button data-copy="${sku}" class="inline-flex items-center gap-2 self-start rounded-lg border border-neutral-200 bg-neutral-50 px-3 py-1.5 text-sm text-neutral-700 transition hover:border-neutral-400 hover:bg-white" title="העתקת המק״ט">
    <span class="text-neutral-500">מק״ט</span><span class="font-mono font-bold tracking-wide" dir="ltr">${sku}</span><span class="text-neutral-400">${copyIco}</span>
  </button>`;
};

const sheetBtn = (url, title, ink, big) => `
  <button data-sheet="${url}" data-title="${title}" class="inline-flex items-center justify-center gap-2 rounded-xl bg-blue-600 font-bold text-white shadow-sm transition hover:bg-blue-700 ${big ? 'w-full px-6 py-4 text-lg sm:w-auto' : 'w-full px-4 py-3 text-base'}">
    ${svg('file', big ? 'h-6 w-6' : 'h-5 w-5', 2)} דף מוצר
  </button>`;

function renderItem(slug) {
  const it = items.find(x => x.slug === slug);
  if (!it) return renderHome();
  document.title = it.title + ' – אדי × טרייד מוביל';
  return `
  <div class="mx-auto max-w-5xl px-4 pb-16 pt-5 sm:px-6">
    ${backLink}
    ${it.parts ? `
    <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-2">
      <div class="flex flex-col gap-2">
        <h1 class="text-2xl font-bold text-neutral-900 sm:text-4xl">${it.title}</h1>
        ${skuChip(it.slug)}
      </div>
      <div class="text-left">
        <div class="text-sm text-neutral-500">שווי ההטבה</div>
        <div class="text-3xl font-extrabold">${fmt(it.price)}</div>
      </div>
    </div>` : `
    <div class="overflow-hidden rounded-2xl border border-neutral-200 bg-white shadow-sm md:flex">
      <div class="flex flex-col gap-2 bg-neutral-50 p-2 md:w-[26rem] md:shrink-0">
        <div class="aspect-[4/3] max-w-full overflow-hidden rounded-xl bg-white">
          <img id="mainPhoto" src="${I(photos[slug].gallery[0])}" alt="${it.title}" class="h-full w-full ${photos[slug].cover ? 'object-cover' : 'object-contain'}">
        </div>
        ${photos[slug].gallery.length > 1 ? `<div class="flex gap-2 overflow-x-auto pb-1">${photos[slug].gallery.map((g, n) => `
          <button data-photo="${I(g)}" class="h-16 w-16 shrink-0 overflow-hidden rounded-lg border-2 bg-white sm:h-20 sm:w-20 ${n === 0 ? 'border-neutral-900' : 'border-transparent'}" aria-label="תמונה ${n + 1}">
            <img src="${I(g)}" alt="" loading="lazy" class="h-full w-full object-cover">
          </button>`).join('')}</div>` : ''}
      </div>
      <div class="flex min-w-0 flex-1 flex-col gap-4 p-5 sm:p-7">
        <div>
          <h1 class="text-2xl font-extrabold leading-tight sm:text-3xl" style="text-wrap:balance">${it.title}</h1>
          <p class="mt-2 text-base text-neutral-600 sm:text-lg">${it.lead}</p>
        </div>
        ${skuChip(it.slug)}
        ${it.points ? `<ul class="space-y-2">${it.points.map(p => `<li class="flex items-start gap-2 text-base sm:text-lg">${star}<span>${p}</span></li>`).join('')}</ul>` : ''}
        ${it.small ? `<p class="text-sm font-medium text-neutral-500">${it.small}</p>` : ''}
        <p class="flex items-start gap-2 text-sm text-neutral-600 sm:text-base"><span class="text-neutral-400">${svg('pin', 'h-5 w-5 mt-0.5 shrink-0', 2)}</span><span><b>התקנה:</b> ${install[it.slug] || installDefault}</span></p>
        ${it.repNote ? `<p class="rounded-xl bg-amber-50 px-4 py-3 text-sm text-amber-900"><b>לנציג:</b> ${it.repNote}</p>` : ''}
        <div class="mt-auto flex flex-col gap-4 border-t border-neutral-100 pt-4 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <div class="text-sm text-neutral-500">שווי ההטבה</div>
            <div class="text-3xl font-extrabold">${fmt(it.price)}</div>
          </div>
          ${it.sheet ? sheetBtn(it.sheet, it.title, it.ink, true) : ''}
        </div>
      </div>
    </div>`}

    ${it.parts ? `
    <h2 class="mb-4 mt-8 text-xl font-bold sm:text-2xl">מה יש בערכה?</h2>
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      ${it.parts.map((p, n) => `
      <div class="flex flex-col overflow-hidden rounded-2xl border border-neutral-200 bg-white shadow-sm">
        <div class="relative aspect-[4/3] max-w-full overflow-hidden bg-white">
          <img src="${I(partPhotos[n])}" alt="${p.name}" loading="lazy" class="h-full w-full object-contain p-3">
          <span class="absolute right-3 top-3 flex h-8 w-8 items-center justify-center rounded-full bg-neutral-100 text-sm font-bold text-neutral-700">${n + 1}</span>
        </div>
        <div class="flex flex-1 flex-col gap-2 p-4">
          <h3 class="text-lg font-bold leading-snug">${p.name}</h3>
          ${skuChip('bcare-' + (n + 1))}
          <p class="text-sm text-neutral-600 sm:text-base">${p.line}</p>
          <div class="mt-auto pt-2">${sheetBtn(p.sheet, p.name, it.ink, false)}</div>
        </div>
      </div>`).join('')}
    </div>` : ''}
  </div>`;
}

// ───── Hamburger menu ─────
const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
const menuLink = (href, icon, label, color, extra = '') =>
  `<a href="${href}" ${extra} class="flex items-center gap-3 rounded-xl px-3 py-3 font-medium hover:bg-neutral-50">
     <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl" style="background:${color[0]};color:${color[1]}">${svg(icon, 'h-5 w-5', 2)}</span>${label}</a>`;
document.getElementById('menuList').innerHTML = `
  ${menuLink('#home', 'home', 'דף הבית', ['#f5f5f5', '#404040'])}
  <div class="px-3 pb-1 pt-4 text-xs font-bold text-neutral-400">המוצרים</div>
  ${items.map(it => menuLink('#p-' + it.slug, it.icon, it.title, ['#f5f5f5', '#404040'])).join('')}
  <div class="my-3 border-t border-neutral-100"></div>
  ${menuLink('#reps', 'users', 'מידע לנציגים', ['#f5f5f5', '#404040'])}`;
function openMenu()  { drawer.classList.remove('translate-x-full'); scrim.classList.remove('hidden'); }
function closeMenu() { drawer.classList.add('translate-x-full'); scrim.classList.add('hidden'); }

// ───── Product-sheet viewer: shows the sheet as a sharp image (rendered from the PDF by Windows' PDF engine) ─────
const modal = document.getElementById('sheet');
const sheetImage = url => url.replace(/^sheets\/(.+)\.pdf$/, 'sheets/img/$1-1.jpg');
function openSheet(url, title) {
  const img = sheetImage(url);
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetLink').href = img;
  document.getElementById('sheetBody').innerHTML =
    `<div class="mx-auto max-w-3xl p-2 sm:p-4"><img src="${img}" alt="${title} – דף מוצר" class="h-auto w-full rounded-lg bg-white shadow"></div>`;
  modal.classList.replace('hidden', 'flex');
  document.body.style.overflow = 'hidden';
}
// ───── Copy SKU + small "copied" toast ─────
const toast = document.createElement('div');
toast.className = 'pointer-events-none fixed inset-x-0 z-[70] mx-auto w-max rounded-full bg-neutral-900 px-5 py-2.5 text-sm font-medium text-white opacity-0 shadow-lg transition-opacity duration-300';
toast.style.bottom = 'calc(1.5rem + env(safe-area-inset-bottom, 0px))';
toast.setAttribute('role', 'status');
document.body.appendChild(toast);
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 1800);
}
function copySku(sku, btn) {
  const fallback = () => {
    const r = document.createRange();
    r.selectNodeContents(btn.querySelector('[dir="ltr"]'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try { document.execCommand('copy'); showToast('המק״ט ' + sku + ' הועתק'); }
    catch { showToast('סמנו את המק״ט והעתיקו'); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(sku).then(() => showToast('המק״ט ' + sku + ' הועתק'), fallback);
  } else fallback();
}

function closeSheet() {
  modal.classList.replace('flex', 'hidden');
  document.getElementById('sheetBody').innerHTML = '';
  document.body.style.overflow = '';
}

document.addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]');
  if (cp) { copySku(cp.dataset.copy, cp); return; }
  const ph = e.target.closest('[data-photo]');
  if (ph) {
    document.getElementById('mainPhoto').src = ph.dataset.photo;
    ph.parentElement.querySelectorAll('[data-photo]').forEach(x => x.classList.replace('border-neutral-900', 'border-transparent'));
    ph.classList.replace('border-transparent', 'border-neutral-900');
    return;
  }
  const b = e.target.closest('[data-sheet]');
  if (b) return openSheet(b.dataset.sheet, b.dataset.title);
  if (e.target === modal || e.target.closest('#sheetClose')) return closeSheet();
  if (e.target.closest('#menuBtn')) return openMenu();
  if (e.target === scrim || e.target.closest('#menuClose')) return closeMenu();
  const s = e.target.closest('[data-scroll]');
  if (s) {
    e.preventDefault(); closeMenu();
    if (location.hash && location.hash !== '#home') location.hash = 'home';
    setTimeout(() => document.getElementById(s.dataset.scroll)?.scrollIntoView({ behavior: 'smooth' }), 60);
    return;
  }
  if (e.target.closest('#drawer a')) closeMenu();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); closeMenu(); } });

function route() {
  const h = location.hash.slice(1);
  closeMenu();
  const app = document.getElementById('app');
  app.innerHTML = h === 'reps' ? renderReps() : h.startsWith('p-') ? renderItem(h.slice(2)) : renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>

</body>
</html>
